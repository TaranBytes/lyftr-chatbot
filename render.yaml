# Render Blueprint: New + > Blueprint > pick this repo.
# FREE plan: no persistent disk, so the SQLite file (/data) is ephemeral and is
# wiped on every restart/redeploy. Keep it awake with an uptime monitor that
# pings /health every 5-14 minutes. For durable history use plan: starter and
# add a disk (name: chat-data, mountPath: /data, sizeGB: 1).
services:
  - type: web
    name: lyftr-chatbot-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS
        sync: false          # you paste the keys in the Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # your Vercel URL, no trailing slash
      - key: LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////data/app.db
